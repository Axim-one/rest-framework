apply plugin: 'java-library'

bootJar {
    enabled = false
}

jar {
    enabled = true
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
}

dependencies {
    implementation project(':core')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'com.mysql:mysql-connector-j'

    api "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisStarterVersion}"

    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}
test {
    // 스냅샷 재생성(의도된 변경일 때만): ./gradlew :mybatis:test -Psnapshot.write=<절대경로>
    if (project.hasProperty('snapshot.write')) {
        systemProperty 'snapshot.write', project.property('snapshot.write')
    }
}
